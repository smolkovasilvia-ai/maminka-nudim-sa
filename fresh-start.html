<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8FBF7"><title>Obnovujem Mami, nudím sa!</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F8FBF7;color:#18312E}.box{text-align:center;padding:32px}.dot{width:54px;height:54px;margin:0 auto 18px;border-radius:50%;background:#DDF7EA;display:grid;place-items:center;font-size:26px;animation:b 1s ease-in-out infinite alternate}@keyframes b{to{transform:translateY(-6px)}}p{color:#6B7C77}</style><div class="box"><div class="dot">✦</div><h2>Obnovujem Nudiho…</h2><p>Čistím starú verziu appky.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}setTimeout(()=>location.replace('./?reset=1&fresh='+Date.now()),500)})();</script></html>

<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#F8FBF7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mami, nudím sa!" />
<title>Mami, nudím sa!</title>
<link rel="manifest" href="manifest.webmanifest?v=reset1" />
<link rel="apple-touch-icon" href="icon-192.png?v=reset1" />
<link rel="stylesheet" href="styles.css?v=reset1" />
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<main class="app-shell" id="app">
  <header class="topbar">
    <button class="brand" id="brandBtn" aria-label="Domov">
      <img src="nudi-mark.svg" alt="" class="brand-mark" />
      <span><strong>Mami, nudím sa!</strong><small>Nudi má plán.</small></span>
    </button>
    <button class="age-pill" id="ageBtn" aria-label="Zmeniť vek"><span id="agePillText">4 roky</span><span aria-hidden="true">⌄</span></button>
  </header>

  <section class="home" id="homeView">
    <div class="hero">
      <img src="nudi.png" class="hero-nudi" alt="Nudi, veselý maskot" />
      <div class="hero-copy">
        <span class="eyebrow">Žiadne vymýšľanie</span>
        <h1>Čo práve potrebuješ?</h1>
        <p>Vyber jednu vec. Hru už domyslíme za teba.</p>
      </div>
    </div>

    <div class="needs" id="needsGrid">
      <button class="need-card need-peace" data-need="peace"><span class="need-icon">☕</span><span><strong>Chcem chvíľu pokoja</strong><small>minimum námahy</small></span></button>
      <button class="need-card need-energy" data-need="energy"><span class="need-icon">⚡</span><span><strong>Vybiť energiu</strong><small>nech sa hýbe</small></span></button>
      <button class="need-card need-together" data-need="together"><span class="need-icon">🤝</span><span><strong>Poďme spolu</strong><small>jedna dobrá hra</small></span></button>
      <button class="need-card need-surprise" data-need="surprise"><span class="need-icon">🎲</span><span><strong>Prekvap ma</strong><small>nič nenastavujem</small></span></button>
    </div>

    <section class="recommendation hidden" id="recommendation" aria-live="polite">
      <div class="recommend-head"><span class="mini-nudi">✦</span><span id="recommendLabel">Nudi vybral</span></div>
      <article class="game-card">
        <div class="game-topline"><span class="game-emoji" id="gameEmoji">🎲</span><div class="game-title-wrap"><h2 id="gameTitle"></h2><div class="meta" id="gameMeta"></div></div></div>
        <div class="materials-preview"><span>Potrebuješ</span><p id="gameMaterials"></p></div>
        <div class="game-actions"><button class="primary" id="startBtn">▶ Spustiť hru</button><button class="secondary" id="anotherBtn">↻ Inú hru</button></div>
      </article>
    </section>

    <p class="tiny-note">35 ručne vybraných hier · 5 pre každý vek · RESET 1</p>
  </section>
</main>

<div class="sheet-backdrop hidden" id="ageSheet" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="ageTitle">
    <div class="sheet-handle"></div><h2 id="ageTitle">Koľko má dieťa rokov?</h2><p>Stačí raz. Vek si zapamätáme v tomto zariadení.</p>
    <div class="age-grid" id="ageGrid"></div>
  </section>
</div>

<div class="game-mode hidden" id="gameMode" aria-hidden="true">
  <header class="game-mode-top"><button class="icon-btn" id="exitGame" aria-label="Zavrieť hru">×</button><div class="game-mode-title" id="gameModeTitle"></div><button class="icon-btn speaker" id="speakBtn" aria-label="Prečítať nahlas">🔊</button></header>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="phase-wrap">
    <div class="phase-card" id="phaseCard">
      <span class="phase-kicker" id="phaseKicker"></span>
      <h2 id="phaseTitle"></h2>
      <div class="phase-body" id="phaseBody"></div>
      <button class="help-link hidden" id="helpBtn">Keď sa zasekne →</button>
    </div>
  </div>
  <footer class="game-footer"><button class="primary game-next" id="nextPhase">Ďalej</button></footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="games.js?v=reset1"></script><script src="app.js?v=reset1"></script>
</body></html>
